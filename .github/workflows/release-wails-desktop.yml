name: Build and release Wails desktop apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
      draft:
        description: 'Create draft release'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            artifact_suffix: linux
          - os: windows-latest
            name: windows
            artifact_suffix: windows
          - os: macos-latest
            name: macos
            artifact_suffix: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-camera/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix frontend-camera

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.112

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxkbcommon-dev
        shell: bash

      - name: Build frontend assets
        run: |
          npm run build --prefix frontend
          mkdir -p cmd/studio/frontend/dist
          rm -rf cmd/studio/frontend/dist/*
          cp -R frontend/dist/. cmd/studio/frontend/dist/
          # Keep placeholders expected by the repository for tracked dist folders.
          touch frontend/dist/placeholder.txt cmd/studio/frontend/dist/placeholder.txt

          npm run build --prefix frontend-camera
          mkdir -p cmd/camera/frontend/dist
          rm -rf cmd/camera/frontend/dist/*
          cp -R frontend-camera/dist/. cmd/camera/frontend/dist/
          touch cmd/camera/frontend/dist/placeholder.txt
        shell: bash

      - name: Build AI Video Studio
        run: |
          cd cmd/studio
          wails3 build -tags prod
        shell: bash

      - name: Build AI Video Camera
        run: |
          cd cmd/camera
          wails3 build -tags prod
        shell: bash

      - name: Package release artifacts
        run: |
          set -euo pipefail

          pick_output_dir() {
            local app="$1"
            if [ -d "cmd/${app}/build/bin" ]; then
              echo "cmd/${app}/build/bin"
              return 0
            fi
            if [ -d "cmd/${app}/bin" ]; then
              echo "cmd/${app}/bin"
              return 0
            fi
            return 1
          }

          mkdir -p release-artifacts

          studio_out="$(pick_output_dir studio)" || {
            echo "Unable to find build artifacts for AI Video Studio" >&2
            exit 1
          }
          camera_out="$(pick_output_dir camera)" || {
            echo "Unable to find build artifacts for AI Video Camera" >&2
            exit 1
          }

          tar -czf "release-artifacts/ai-video-studio-${{ matrix.artifact_suffix }}.tar.gz" -C "${studio_out}" .
          tar -czf "release-artifacts/ai-video-camera-${{ matrix.artifact_suffix }}.tar.gz" -C "${camera_out}" .
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wails-desktop-${{ matrix.artifact_suffix }}
          path: release-artifacts/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wails-desktop-*
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft || false }}
          files: release-artifacts/*.tar.gz
          generate_release_notes: true
